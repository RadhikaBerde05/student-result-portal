<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudentIQ Analytics</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
🎓 StudentIQ
</div>

<ul>

<li><a href="index.html">Dashboard</a></li>

<li><a href="students.html">Students</a></li>

<li><a href="analytics.html">Analytics</a></li>

<li><a href="reports.html">Reports</a></li>

</ul>

</nav>

<section class="hero">

<h1>
Student Performance Analytics System
</h1>

<p>
Monitor academic performance and analytics
in real time.
</p>

</section>

<section class="stats">

<div class="card">

<i class="fas fa-users"></i>

<h2>500</h2>

<p>Students</p>

</div>

<div class="card">

<i class="fas fa-chart-line"></i>

<h2>90%</h2>

<p>Pass Rate</p>

</div>

<div class="card">

<i class="fas fa-trophy"></i>

<h2>95%</h2>

<p>Top Score</p>

</div>

<div class="card">

<i class="fas fa-user-clock"></i>

<h2>50</h2>

<p>At Risk</p>

</div>

</section>

<section class="search">

<h2>Search Student</h2>

<input
type="text"
id="rollNo"
placeholder="Enter Roll No (MCA101)"
>

<button onclick="checkResult()">
Search
</button>

</section>

<section
class="student-card"
id="resultCard"
style="display:none;">

<h2 id="studentName"></h2>

<p id="studentRoll"></p>

<p id="studentStatus"></p>

<div class="progress">

<div
class="progress-fill"
id="progressBar">

</div>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
